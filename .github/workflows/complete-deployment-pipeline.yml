name: Complete Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest tests/; else echo "✅ No tests to run"; fi

      - name: Lint code
        run: |
          pip install flake8
          flake8 src/ || true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Simulate Docker build
        run: |
          echo "✅ Docker build simulation passed!"
          echo "📦 Image: aimenfatima21-star/data-warehouse-project:${{ github.sha }}"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Simulate staging deployment
        run: |
          echo "✅ Deploying to staging..."
          echo "✅ Staging deployment successful!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simulate production deployment
        run: |
          echo "✅ Deploying to production..."
          echo "✅ Production deployment successful!"

  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    steps:
      - name: Simulate rollback
        run: |
          echo "⚠️ Rolling back..."
          echo "✅ Rollback successful!"
